# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing these this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.github_repo }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: PH 142
description: Website for PH 142 Fall 2026
author: PH 142 Staff
email: 142gsi@berkeley.edu
baseurl: '/fa26' # the subpath of your site, e.g. /blog
url: 'https://ph142-ucb.github.io' # the base hostname & protocol for your site, e.g. http://example.com
exclude: ["Gemfile", "Gemfile.lock", "LICENSE", "README.md", "schedule.md"]

# Theme settings
remote_theme: pmarsceill/just-the-docs@v0.2.7
color_scheme: light
search_enabled: true
heading_anchors: false
permalink: pretty
nav_links:
  Gradescope:
    - 'https://www.gradescope.com/courses/1354579'
  Ed:
    - 'https://edstem.org/us/courses/93012/discussion'
  Datahub:
    - 'https://publichealth.datahub.berkeley.edu/hub/login?next=%2Fhub%2Fuser-redirect%2Fgit-pull%3Frepo%3Dhttps%253A%252F%252Fgithub.com%252Fph142-ucb%252Fph142-su26%26urlpath%3Drstudio%252F%26branch%3Dmain'
 # Grade Calculator:
  #  - 'https://xiangyu-yu.shinyapps.io/ph142-grading/'
    
nav_footer_content: "Powered by <a href=\"https://github.com/kevinlin1/just-the-class\">Just the Class</a>"

# Collections for website data
collections:
  - modules
  - announcements
  - staffers
# Default layouts for each collection type
defaults:
  - scope:
      path: ''
      type: modules
    values:
      layout: module
  - scope:
      path: ''
      type: announcements
    values:
      layout: announcement
  - scope:
      path: ''
      type: staffers
    values:
      layout: staffer

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false
plugins:
  - jekyll-livereload
